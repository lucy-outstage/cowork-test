<style>
  :root{
    --ground:#ffffff; --surface:#f5f6fa; --surface-2:#eceef6; --border:#d9dce6;
    --ink:#1b1d24; --muted:#5b6172; --faint:#8a90a2;
    --accent:#343ced; --accent-2:#2a30c4; --accent-ink:#ffffff; --accent-soft:#e9eaff;
    --radius:14px; --maxw:1180px;
    --font:"Segoe UI",-apple-system,BlinkMacSystemFont,system-ui,"Helvetica Neue",Arial,sans-serif;
    --shadow:0 1px 2px rgba(20,22,40,.04),0 8px 24px rgba(20,22,40,.06);
  }
  @media (prefers-color-scheme:dark){
    :root{
      --ground:#0f111a; --surface:#171a26; --surface-2:#1f2333; --border:#2c3143;
      --ink:#eaecf3; --muted:#9aa0b4; --faint:#6b7186;
      --accent:#6c72ff; --accent-2:#7b81ff; --accent-ink:#0f111a; --accent-soft:#20233a;
      --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.35);
    }
  }
  :root[data-theme="dark"]{
    --ground:#0f111a; --surface:#171a26; --surface-2:#1f2333; --border:#2c3143;
    --ink:#eaecf3; --muted:#9aa0b4; --faint:#6b7186;
    --accent:#6c72ff; --accent-2:#7b81ff; --accent-ink:#0f111a; --accent-soft:#20233a;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.35);
  }
  :root[data-theme="light"]{
    --ground:#ffffff; --surface:#f5f6fa; --surface-2:#eceef6; --border:#d9dce6;
    --ink:#1b1d24; --muted:#5b6172; --faint:#8a90a2;
    --accent:#343ced; --accent-2:#2a30c4; --accent-ink:#ffffff; --accent-soft:#e9eaff;
    --shadow:0 1px 2px rgba(20,22,40,.04),0 8px 24px rgba(20,22,40,.06);
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{background:var(--ground);color:var(--ink);font-family:var(--font);line-height:1.55;
    -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;overflow-x:hidden}
  .wrap{max-width:var(--maxw);margin:0 auto;padding:0 20px}

  /* top bar */
  .topbar{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--ground) 88%,transparent);
    backdrop-filter:saturate(1.4) blur(8px);border-bottom:1px solid var(--border)}
  .topbar .wrap{display:flex;align-items:center;gap:16px;height:64px}
  .brand{display:flex;align-items:baseline;gap:10px;font-weight:800;letter-spacing:-.02em;font-size:1.15rem}
  .brand .dot{width:9px;height:9px;border-radius:50%;background:var(--accent);display:inline-block;transform:translateY(-1px)}
  .tag{color:var(--muted);font-size:.9rem;font-weight:600}
  .tag b{color:var(--ink)}
  .spacer{flex:1}
  .toolbar{display:flex;align-items:center;gap:8px}
  .btn{font-family:inherit;font-size:.85rem;font-weight:700;border-radius:10px;border:1px solid var(--border);
    background:var(--surface);color:var(--ink);padding:8px 13px;cursor:pointer;transition:.15s;display:inline-flex;align-items:center;gap:7px}
  .btn:hover{border-color:var(--accent);color:var(--accent)}
  .btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
  .btn.primary:hover{background:var(--accent-2);color:var(--accent-ink)}
  .btn svg{width:15px;height:15px}
  .icon-btn{width:38px;height:38px;justify-content:center;padding:0}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}

  /* layout */
  .layout{display:grid;grid-template-columns:320px 1fr;gap:26px;padding:26px 0 60px}
  .layout>*{min-width:0}
  .rail{display:flex;flex-direction:column;gap:9px;position:sticky;top:88px;align-self:start}
  .rail-head{font-size:.72rem;font-weight:800;letter-spacing:.13em;text-transform:uppercase;color:var(--faint);margin:2px 4px 6px}
  .uc{display:flex;gap:12px;align-items:center;text-align:left;width:100%;cursor:pointer;
    background:var(--surface);border:1px solid var(--border);border-left:3px solid transparent;
    border-radius:12px;padding:12px 13px;transition:.15s;color:inherit;font-family:inherit}
  .uc:hover{border-color:var(--accent);background:var(--surface-2)}
  .uc[aria-selected="true"]{border-left-color:var(--accent);background:var(--surface-2);box-shadow:var(--shadow)}
  .uc-ico{flex:none;width:40px;height:40px;border-radius:10px;background:var(--accent-soft);color:var(--accent);
    display:flex;align-items:center;justify-content:center}
  .uc-ico svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  .uc-body{min-width:0;flex:1}
  .uc-title{display:block;font-weight:750;font-size:.95rem;letter-spacing:-.01em;line-height:1.25}
  .uc-seg{display:block;font-size:.74rem;color:var(--muted);font-weight:650;margin-top:3px}
  .uc-num{align-self:flex-start;font-size:.72rem;color:var(--faint);font-weight:700;font-variant-numeric:tabular-nums}

  /* main page */
  .page{background:var(--ground);min-width:0}
  .hero{border:1px solid var(--border);border-radius:var(--radius);background:
     linear-gradient(180deg,color-mix(in srgb,var(--accent-soft) 55%,var(--ground)),var(--ground));
     padding:30px 30px 26px;box-shadow:var(--shadow)}
  .eyebrow{font-size:.74rem;font-weight:800;letter-spacing:.13em;text-transform:uppercase;color:var(--accent);margin:0 0 12px}
  h1{font-size:clamp(1.9rem,3.4vw,2.75rem);line-height:1.04;letter-spacing:-.025em;font-weight:820;margin:0 0 12px;text-wrap:balance;max-width:20ch}
  .subhead{font-size:1.12rem;color:var(--muted);margin:0 0 20px;max-width:60ch;font-weight:550}
  .hero-actions{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
  .glance{display:flex;flex-wrap:wrap;gap:8px;margin-top:20px;padding-top:18px;border-top:1px solid var(--border)}
  .chip{display:inline-flex;align-items:center;gap:7px;font-size:.8rem;font-weight:650;color:var(--ink);
    background:var(--surface);border:1px solid var(--border);border-radius:999px;padding:6px 12px}
  .chip .k{color:var(--faint);font-weight:700;text-transform:uppercase;letter-spacing:.06em;font-size:.68rem}

  .cols{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:16px}
  .card{border:1px solid var(--border);border-radius:var(--radius);background:var(--surface);padding:22px 22px}
  .card h3{margin:0 0 12px;font-size:.78rem;font-weight:800;letter-spacing:.11em;text-transform:uppercase;color:var(--faint)}
  .card p{margin:0;color:var(--ink)}
  .steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:11px}
  .steps li{display:flex;gap:11px;align-items:flex-start;font-size:.97rem}
  .steps .tick{flex:none;width:21px;height:21px;border-radius:6px;background:var(--accent-soft);color:var(--accent);
    display:flex;align-items:center;justify-content:center;margin-top:1px}
  .steps .tick svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}

  .outcome{margin-top:16px;border-radius:var(--radius);background:var(--accent);color:var(--accent-ink);
    padding:24px 26px;box-shadow:var(--shadow)}
  .outcome .k{font-size:.74rem;font-weight:800;letter-spacing:.13em;text-transform:uppercase;opacity:.8;margin:0 0 8px}
  .outcome p{margin:0;font-size:1.3rem;font-weight:750;letter-spacing:-.015em;line-height:1.28;text-wrap:balance}

  .footrow{display:flex;flex-wrap:wrap;gap:16px;align-items:center;justify-content:space-between;
    margin-top:16px;padding:20px 22px;border:1px solid var(--border);border-radius:var(--radius);background:var(--surface)}
  .proof{font-style:italic;color:var(--muted);font-size:.95rem;max-width:62ch;margin:0}
  .proof b{color:var(--ink);font-style:normal}

  .note{color:var(--faint);font-size:.8rem;margin:26px 4px 0;text-align:center;line-height:1.5}
  .note code{background:var(--surface-2);padding:1px 6px;border-radius:5px;font-size:.92em}

  /* toast */
  .toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);
    background:var(--ink);color:var(--ground);padding:11px 18px;border-radius:10px;font-size:.9rem;font-weight:650;
    box-shadow:0 10px 30px rgba(0,0,0,.25);opacity:0;pointer-events:none;transition:.22s;z-index:50}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

  .fade{animation:fade .28s ease}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

  @media (max-width:900px){
    .layout{display:block;padding:18px 0 50px}
    .rail{position:static;flex-direction:column;gap:9px;margin-bottom:18px}
    .rail-head{display:block}
    .uc{min-width:0;width:100%}
    .cols{grid-template-columns:1fr}
    .hero{padding:24px 20px}
  }
  .tag-mob{display:none}
  @media (max-width:620px){ .tag{display:none} .brand{font-size:1.05rem} }
</style>

<header class="topbar">
  <div class="wrap">
    <div class="brand"><span class="dot"></span>Plansom</div>
    <div class="tag">Use&nbsp;cases · <b>Simply done.</b></div>
    <div class="spacer"></div>
    <div class="toolbar">
      <button class="btn" id="copyAll" title="Copy all five as website copy">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h8"/></svg>
        Copy all
      </button>
      <button class="btn icon-btn" id="themeBtn" title="Toggle light / dark" aria-label="Toggle theme">
        <svg id="themeIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8Z"/></svg>
      </button>
    </div>
  </div>
</header>

<main class="wrap layout">
  <nav class="rail" aria-label="Use cases">
    <div class="rail-head">Five key use cases</div>
    <div id="railList"></div>
  </nav>
  <section class="page" id="page" aria-live="polite"></section>
</main>

<div class="toast" id="toast">Copied</div>

<script>
const ICON = {
  target:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="4"/><circle cx="12" cy="12" r="1"/></svg>',
  bars:'<svg viewBox="0 0 24 24"><path d="M5 20V11M12 20V5M19 20v-6"/></svg>',
  teams:'<svg viewBox="0 0 24 24"><rect x="4" y="4" width="7" height="7" rx="1.5"/><rect x="13" y="4" width="7" height="7" rx="1.5"/><rect x="4" y="13" width="7" height="7" rx="1.5"/><rect x="13" y="13" width="7" height="7" rx="1.5"/></svg>',
  bolt:'<svg viewBox="0 0 24 24"><path d="M13 2 4 14h7l-1 8 9-12h-7l1-8Z"/></svg>',
  rocket:'<svg viewBox="0 0 24 24"><path d="M5 15c-1.5 1.5-2 5-2 5s3.5-.5 5-2M9 12l3 3M14.5 4.5C18 3 21 6 19.5 9.5c-1.2 2.8-5 6-7.5 7.5L8 13.5C9.5 11 12.7 7.2 14.5 4.5Z"/><circle cx="14.5" cy="9.5" r="1.4"/></svg>'
};
const TICK='<svg viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></svg>';

const CASES=[
 {icon:'target',seg:'Leadership · Founders',trigger:'New quarter — OKRs set',metric:'More objectives actually hit',
  h1:'Turn OKRs into plans that actually move.',
  sub:'Set the objective. Plansom builds the plan, assigns the work, and tracks it to done.',
  problem:'You set bold OKRs — then they die in a slide deck. Teams read them differently, work drifts, and by quarter-end nobody is sure what really moved. The gap between strategy and delivery is where goals disappear.',
  how:['Paste your OKRs — Plansom turns each objective into a live plan.','Goals, tasks, owners and timelines, generated for you.','Priorities ranked so teams clear bottlenecks, not busywork.','AI agents pick up tasks and report progress.','Track every objective in one place; repeat what works next quarter.'],
  outcome:'Every objective has a plan, an owner and live progress — no more quarter-end surprises.',
  proof:'<b>Trusted by Microsoft.</b> “Plansom makes delegation easy… helps organizations focus on outcomes.” — Sherry List, CTO, Microsoft for Startups.',
  cta:'Turn your OKRs into plans'},

 {icon:'bars',seg:'Ops · PMO · Chief of Staff',trigger:'Status-meeting overload',metric:'Hours a week reclaimed',
  h1:'Kill the status meeting.',
  sub:'Progress tracks itself, live — so the weekly update becomes a glance, not a meeting.',
  problem:'Half the week goes on chasing updates and building status decks. By the time the meeting happens the data is already stale — and no one leaves with clearer priorities.',
  how:['Plans update in real time as work moves — inside Microsoft Teams.','One live view of every goal, owner and blocker.','Priorities auto-ranked so the team focuses where it matters.','AI agents chase the routine follow-ups for you.','Async by default; meet only to unblock.'],
  outcome:'Reclaim the status meeting. Managers spend their time unblocking, not reporting.',
  proof:'<b>Live inside Microsoft Teams.</b> SOC 2 (Type II), GDPR + CCPA — and your data is never used to train LLMs.',
  cta:'See progress live'},

 {icon:'teams',seg:'Teams-native organisations',trigger:'Already in Microsoft Teams',metric:'One shared plan, zero new apps',
  h1:'Run the work where the work happens.',
  sub:'Plansom turns goals into shared plans right inside Microsoft Teams — no new app for your team to learn.',
  problem:'Cross-functional projects scatter across chats, tabs and tools. Context gets lost, and the plan somehow lives in five places at once.',
  how:['Native in Microsoft Teams — goals, plans and progress where your team already works.','Share a plan in a channel; everyone is aligned instantly.','Connects to Slack, Google Workspace, Salesforce, HubSpot and more.','AI agents act on tasks without anyone leaving Teams.','Built with Microsoft for Startups on Foundry SDKs.'],
  outcome:'One shared plan, inside Teams. Nothing lost between tools.',
  proof:'<b>Built with Microsoft for Startups.</b> “Embedding goal alignment and progress directly inside the daily workflow…” — Sherry List, CTO.',
  cta:'Add Plansom to Teams'},

 {icon:'bolt',seg:'Teams adopting AI',trigger:'Want agents that do work',metric:'Routine tasks off your plate',
  h1:'Put AI agents to work — not just to chat.',
  sub:'Assign a task to an agent. Watch it get done, with the outcome and progress in your plan.',
  problem:'AI that only chats leaves the work to you. You don’t need another assistant to talk to — you need tasks off your plate and outcomes you can see.',
  how:['Assign tasks in your plan to AI agents.','Agents do real work and report outcomes and progress.','Start with one workflow; expand as you trust it.','People and agents in one place — the whole plan, not a side chat.','Secure by default: encrypted, never used to train LLMs.'],
  outcome:'Your team ships more, because agents clear the routine work.',
  proof:'<b>Enterprise-safe by default.</b> Azure-hosted, encrypted, SOC 2 (Type II), GDPR + CCPA.',
  cta:'Delegate to an agent'},

 {icon:'rocket',seg:'Funded scale-ups · Founders',trigger:'Just raised — growing fast',metric:'Growth without the chaos',
  h1:'Scale without the chaos.',
  sub:'New goals every week. One place to run them — so growth doesn’t break coordination.',
  problem:'You just raised, or you’re growing fast. Headcount climbs, priorities multiply, and the informal coordination that worked at ten people falls apart at fifty.',
  how:['Goal-in, plan-out — no blank boards to build.','Priorities ranked so the team clears bottlenecks as they appear.','AI agents absorb the growing task load.','Shareable plans keep new hires aligned from day one.','Repeat what works as you scale.'],
  outcome:'Grow the team without growing the chaos. Everyone knows the goal and the next action.',
  proof:'<b>Backed by Microsoft for Startups.</b> Ready for scale — SOC 2 (Type II), GDPR + CCPA.',
  cta:'Scale with Plansom'},
];

let active=0;
const railList=document.getElementById('railList');
const page=document.getElementById('page');

CASES.forEach((c,i)=>{
  const b=document.createElement('button');
  b.className='uc'; b.setAttribute('role','tab'); b.setAttribute('aria-selected', i===0);
  b.innerHTML=`<span class="uc-ico">${ICON[c.icon]}</span>
    <span class="uc-body"><span class="uc-title">${c.h1.replace(/\.$/,'')}</span><span class="uc-seg">${c.seg}</span></span>
    <span class="uc-num">0${i+1}</span>`;
  b.addEventListener('click',()=>select(i));
  railList.appendChild(b);
});
const railBtns=[...railList.children];

function render(){
  const c=CASES[active];
  page.innerHTML=`
   <div class="fade">
    <div class="hero">
      <p class="eyebrow">${c.seg}</p>
      <h1>${c.h1}</h1>
      <p class="subhead">${c.sub}</p>
      <div class="hero-actions">
        <button class="btn primary" data-cta>${c.cta} →</button>
        <button class="btn" id="copyOne">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h8"/></svg>
          Copy page copy
        </button>
      </div>
      <div class="glance">
        <span class="chip"><span class="k">Segment</span> ${c.seg}</span>
        <span class="chip"><span class="k">Ready when</span> ${c.trigger}</span>
        <span class="chip"><span class="k">Payoff</span> ${c.metric}</span>
      </div>
    </div>

    <div class="cols">
      <div class="card"><h3>The problem</h3><p>${c.problem}</p></div>
      <div class="card"><h3>How Plansom helps</h3>
        <ul class="steps">${c.how.map(s=>`<li><span class="tick">${TICK}</span><span>${s}</span></li>`).join('')}</ul>
      </div>
    </div>

    <div class="outcome"><p class="k">The outcome</p><p>${c.outcome}</p></div>

    <div class="footrow">
      <p class="proof">${c.proof}</p>
      <button class="btn primary" data-cta>${c.cta} →</button>
    </div>

    <p class="note">Website page copy · draft. Brand type is <b>Gilroy</b> (set here in a system stack). Bracketed metrics are illustrative — swap in real numbers. This dashboard is a working preview, so the <b>${c.cta}</b> button is a mock CTA.</p>
   </div>`;
  railBtns.forEach((b,i)=>b.setAttribute('aria-selected', i===active));
  page.querySelector('#copyOne').addEventListener('click',()=>{copyText(caseToText(c)); toast('Page copy copied');});
  page.querySelectorAll('[data-cta]').forEach(el=>el.addEventListener('click',()=>toast('Mock CTA — wire this to your signup flow')));
}
function select(i){ active=(i+CASES.length)%CASES.length; render();
  railBtns[active].scrollIntoView({block:'nearest',inline:'nearest',behavior:'smooth'}); }

function caseToText(c){
  return `# ${c.h1}\n${c.sub}\n\nTHE PROBLEM\n${c.problem}\n\nHOW PLANSOM HELPS\n`+
    c.how.map(s=>`- ${s}`).join('\n')+
    `\n\nTHE OUTCOME\n${c.outcome}\n\nPROOF\n${c.proof.replace(/<\/?b>/g,'')}\n\nCTA: ${c.cta}\n\n[Segment: ${c.seg} · Ready when: ${c.trigger} · Payoff: ${c.metric}]`;
}
function copyText(t){
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t).catch(()=>fallbackCopy(t));}
  else fallbackCopy(t);
}
function fallbackCopy(t){const ta=document.createElement('textarea');ta.value=t;document.body.appendChild(ta);ta.select();try{document.execCommand('copy');}catch(e){}ta.remove();}

let toastTimer;
function toast(msg){const el=document.getElementById('toast');el.textContent=msg;el.classList.add('show');
  clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('show'),1900);}

document.getElementById('copyAll').addEventListener('click',()=>{
  copyText(CASES.map(caseToText).join('\n\n———\n\n')); toast('All five copied');
});

// theme toggle
const root=document.documentElement;
function currentDark(){const t=root.getAttribute('data-theme');
  if(t)return t==='dark'; return matchMedia('(prefers-color-scheme:dark)').matches;}
document.getElementById('themeBtn').addEventListener('click',()=>{
  root.setAttribute('data-theme', currentDark()?'light':'dark');
});

// keyboard nav
addEventListener('keydown',e=>{
  if(e.key==='ArrowDown'||e.key==='ArrowRight'){select(active+1);e.preventDefault();}
  if(e.key==='ArrowUp'||e.key==='ArrowLeft'){select(active-1);e.preventDefault();}
});

render();
</script>
