<title>Plansom GTM Playbook Library</title>
<style>
  :root{
    --ground:#f6f7fc; --surface:#ffffff; --surface-2:#eef0f8; --surface-3:#e6e9f5;
    --border:#dcdfec; --border-2:#c9cddf;
    --ink:#171a24; --muted:#565d72; --faint:#878da2;
    --accent:#343ced; --accent-2:#2a30c4; --accent-ink:#ffffff; --accent-soft:#e7e8ff;
    /* semantic difficulty — deliberately NOT the accent hue */
    --starter:#0f9b6c; --starter-soft:#dcf5ec;
    --core:#5c6270; --core-soft:#e9ebf1;
    --advanced:#c26a11; --advanced-soft:#fbeed9;
    --radius:15px; --maxw:1320px;
    --sans:"Gilroy","Segoe UI",-apple-system,BlinkMacSystemFont,system-ui,"Helvetica Neue",Arial,sans-serif;
    --mono:"Berkeley Mono","JetBrains Mono",ui-monospace,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;
    --shadow-sm:0 1px 2px rgba(18,20,40,.05);
    --shadow:0 1px 2px rgba(18,20,40,.05),0 10px 30px rgba(18,20,40,.08);
    --shadow-lg:0 2px 6px rgba(18,20,40,.06),0 24px 60px rgba(18,20,40,.14);
  }
  @media (prefers-color-scheme:dark){
    :root{
      --ground:#0d0f17; --surface:#151824; --surface-2:#1d2130; --surface-3:#262b3d;
      --border:#2a3042; --border-2:#3a4157;
      --ink:#e9ebf4; --muted:#9aa0b6; --faint:#6b7188;
      --accent:#7379ff; --accent-2:#8a8fff; --accent-ink:#0b0d15; --accent-soft:#1e2135;
      --starter:#3fd39b; --starter-soft:#132a22;
      --core:#aab0c2; --core-soft:#232838;
      --advanced:#f0a94e; --advanced-soft:#2e2415;
      --shadow-sm:0 1px 2px rgba(0,0,0,.4);
      --shadow:0 1px 2px rgba(0,0,0,.4),0 12px 34px rgba(0,0,0,.5);
      --shadow-lg:0 2px 6px rgba(0,0,0,.5),0 28px 70px rgba(0,0,0,.6);
    }
  }
  :root[data-theme="dark"]{
    --ground:#0d0f17; --surface:#151824; --surface-2:#1d2130; --surface-3:#262b3d;
    --border:#2a3042; --border-2:#3a4157;
    --ink:#e9ebf4; --muted:#9aa0b6; --faint:#6b7188;
    --accent:#7379ff; --accent-2:#8a8fff; --accent-ink:#0b0d15; --accent-soft:#1e2135;
    --starter:#3fd39b; --starter-soft:#132a22;
    --core:#aab0c2; --core-soft:#232838;
    --advanced:#f0a94e; --advanced-soft:#2e2415;
    --shadow-sm:0 1px 2px rgba(0,0,0,.4);
    --shadow:0 1px 2px rgba(0,0,0,.4),0 12px 34px rgba(0,0,0,.5);
    --shadow-lg:0 2px 6px rgba(0,0,0,.5),0 28px 70px rgba(0,0,0,.6);
  }
  :root[data-theme="light"]{
    --ground:#f6f7fc; --surface:#ffffff; --surface-2:#eef0f8; --surface-3:#e6e9f5;
    --border:#dcdfec; --border-2:#c9cddf;
    --ink:#171a24; --muted:#565d72; --faint:#878da2;
    --accent:#343ced; --accent-2:#2a30c4; --accent-ink:#ffffff; --accent-soft:#e7e8ff;
    --starter:#0f9b6c; --starter-soft:#dcf5ec;
    --core:#5c6270; --core-soft:#e9ebf1;
    --advanced:#c26a11; --advanced-soft:#fbeed9;
    --shadow-sm:0 1px 2px rgba(18,20,40,.05);
    --shadow:0 1px 2px rgba(18,20,40,.05),0 10px 30px rgba(18,20,40,.08);
    --shadow-lg:0 2px 6px rgba(18,20,40,.06),0 24px 60px rgba(18,20,40,.14);
  }

  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--ground);color:var(--ink);font-family:var(--sans);
    line-height:1.55;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
    font-feature-settings:"ss01","cv01";overflow-x:hidden;
  }
  a{color:inherit}
  ::selection{background:var(--accent-soft);color:var(--ink)}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
  .mono{font-family:var(--mono);font-feature-settings:"zero"}

  /* ---------- shell ---------- */
  .wrap{max-width:var(--maxw);margin:0 auto;padding:0 20px}
  header.top{
    position:sticky;top:0;z-index:40;
    background:color-mix(in srgb,var(--ground) 86%,transparent);
    backdrop-filter:saturate(1.4) blur(12px);
    border-bottom:1px solid var(--border);
  }
  .top-in{display:flex;align-items:center;gap:16px;padding:14px 0}
  .brand{display:flex;align-items:center;gap:11px;min-width:0}
  .mark{
    width:34px;height:34px;border-radius:9px;flex:none;position:relative;
    background:linear-gradient(150deg,var(--accent),var(--accent-2));
    box-shadow:0 3px 10px color-mix(in srgb,var(--accent) 40%,transparent);
  }
  .mark::before{content:"";position:absolute;inset:0;border-radius:9px;
    background:
      radial-gradient(circle at 30% 28%,rgba(255,255,255,.9) 0 2.4px,transparent 3px),
      radial-gradient(circle at 68% 44%,rgba(255,255,255,.65) 0 2px,transparent 2.6px),
      radial-gradient(circle at 46% 72%,rgba(255,255,255,.8) 0 2.2px,transparent 2.8px);
  }
  .mark::after{content:"";position:absolute;inset:0;border-radius:9px;
    background:
      linear-gradient(45deg,transparent 46%,rgba(255,255,255,.55) 47% 53%,transparent 54%);
    -webkit-mask:linear-gradient(#000,#000);opacity:.5}
  .brand h1{font-size:1rem;margin:0;font-weight:800;letter-spacing:-.01em;white-space:nowrap}
  .brand .sub{font-size:.7rem;color:var(--faint);font-family:var(--mono);letter-spacing:.02em;white-space:nowrap}
  .top-spacer{flex:1}
  .top-stat{font-family:var(--mono);font-size:.72rem;color:var(--muted);white-space:nowrap}
  .top-stat b{color:var(--ink)}
  .icon-btn{
    font-family:var(--sans);font-size:.8rem;font-weight:700;border-radius:10px;
    border:1px solid var(--border-2);background:var(--surface);color:var(--ink);
    padding:8px 12px;cursor:pointer;transition:.15s;display:inline-flex;align-items:center;gap:7px;white-space:nowrap;
  }
  .icon-btn:hover{border-color:var(--accent);color:var(--accent)}
  .icon-btn svg{width:15px;height:15px}

  /* ---------- layout ---------- */
  main{display:grid;grid-template-columns:340px minmax(0,1fr);gap:26px;padding:24px 0 64px;align-items:start}
  @media (max-width:940px){ main{grid-template-columns:1fr;gap:16px} }

  /* ---------- catalog rail ---------- */
  .rail{position:sticky;top:74px;display:flex;flex-direction:column;gap:14px;max-height:calc(100vh - 90px)}
  @media (max-width:940px){ .rail{position:static;max-height:none} }
  .search{position:relative}
  .search input{
    width:100%;font-family:var(--sans);font-size:.9rem;color:var(--ink);
    background:var(--surface);border:1px solid var(--border-2);border-radius:11px;
    padding:11px 12px 11px 36px;transition:.15s;
  }
  .search input::placeholder{color:var(--faint)}
  .search input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
  .search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--faint)}

  .filters{display:flex;flex-wrap:wrap;gap:6px}
  .fchip{
    font-family:var(--mono);font-size:.7rem;font-weight:600;letter-spacing:.02em;
    border:1px solid var(--border-2);background:var(--surface);color:var(--muted);
    padding:5px 10px;border-radius:999px;cursor:pointer;transition:.14s;
  }
  .fchip:hover{border-color:var(--accent);color:var(--accent)}
  .fchip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}

  .list{overflow-y:auto;display:flex;flex-direction:column;gap:8px;padding:2px;margin:-2px}
  .list::-webkit-scrollbar{width:9px}
  .list::-webkit-scrollbar-thumb{background:var(--border-2);border-radius:99px;border:2px solid var(--ground)}
  .cat-head{font-family:var(--mono);font-size:.66rem;letter-spacing:.14em;text-transform:uppercase;
    color:var(--faint);padding:10px 4px 2px;font-weight:600}

  .pb{
    display:grid;grid-template-columns:34px minmax(0,1fr);gap:11px;text-align:left;width:100%;
    background:var(--surface);border:1px solid var(--border);border-left:3px solid transparent;
    border-radius:12px;padding:11px 12px;cursor:pointer;transition:.15s;color:inherit;font-family:inherit;
  }
  .pb:hover{border-color:var(--border-2);background:var(--surface);transform:translateX(2px)}
  .pb[aria-selected="true"]{border-left-color:var(--accent);background:var(--surface);box-shadow:var(--shadow);transform:none}
  .pb[aria-selected="true"] .pb-ico{background:var(--accent);color:var(--accent-ink)}
  .pb-ico{width:34px;height:34px;border-radius:9px;background:var(--surface-2);color:var(--accent);
    display:grid;place-items:center;flex:none;transition:.15s}
  .pb-ico svg{width:18px;height:18px}
  .pb-code{font-family:var(--mono);font-size:.64rem;color:var(--faint);letter-spacing:.03em;font-weight:600}
  .pb-title{font-size:.88rem;font-weight:700;line-height:1.28;margin:1px 0 5px;letter-spacing:-.006em;text-wrap:balance}
  .pb-meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .diff{font-family:var(--mono);font-size:.62rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase;
    padding:2px 7px;border-radius:6px}
  .diff.starter{background:var(--starter-soft);color:var(--starter)}
  .diff.core{background:var(--core-soft);color:var(--core)}
  .diff.advanced{background:var(--advanced-soft);color:var(--advanced)}
  .ttv{font-family:var(--mono);font-size:.66rem;color:var(--muted);display:inline-flex;align-items:center;gap:4px}
  .ttv svg{width:11px;height:11px;opacity:.7}
  .empty{padding:26px 10px;text-align:center;color:var(--faint);font-size:.85rem}

  /* ---------- playbook panel ---------- */
  .panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
    box-shadow:var(--shadow-lg);overflow:hidden;min-width:0}
  .ph{position:relative;padding:26px 30px 22px;
    background:
      radial-gradient(120% 140% at 100% -10%,color-mix(in srgb,var(--accent-soft) 60%,transparent),transparent 60%),
      var(--surface);
    border-bottom:1px solid var(--border)}
  .ph-tab{display:inline-flex;align-items:center;gap:9px;font-family:var(--mono);font-size:.68rem;
    letter-spacing:.04em;color:var(--muted);margin-bottom:14px;font-weight:600}
  .ph-tab .code{color:var(--accent);font-weight:700}
  .ph-tab .sep{width:4px;height:4px;border-radius:50%;background:var(--border-2)}
  .ph h2{font-size:clamp(1.4rem,3.2vw,2rem);line-height:1.1;margin:0 0 10px;font-weight:800;
    letter-spacing:-.02em;text-wrap:balance;max-width:22ch}
  .objective{font-size:1.02rem;color:var(--muted);margin:0;max-width:60ch;line-height:1.5}
  .objective b{color:var(--ink);font-weight:700}

  .metabar{display:flex;flex-wrap:wrap;gap:0;margin-top:20px;border:1px solid var(--border);
    border-radius:12px;overflow:hidden;background:var(--surface)}
  .metabar .m{flex:1 1 140px;min-width:0;padding:11px 14px;border-right:1px solid var(--border)}
  .metabar .m:last-child{border-right:none}
  @media (max-width:560px){ .metabar .m{flex:1 1 50%;border-bottom:1px solid var(--border)} }
  .m .k{font-family:var(--mono);font-size:.62rem;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);font-weight:600}
  .m .v{font-size:.9rem;font-weight:700;margin-top:3px;letter-spacing:-.01em}

  .pbody{padding:6px 30px 30px}
  @media (max-width:560px){ .ph{padding:22px 18px} .pbody{padding:6px 18px 24px} }

  section.sec{padding:24px 0;border-bottom:1px solid var(--border)}
  section.sec:last-child{border-bottom:none}
  .sec-h{display:flex;align-items:center;gap:11px;margin:0 0 15px}
  .sec-h .n{font-family:var(--mono);font-size:.7rem;font-weight:700;color:var(--accent);
    background:var(--accent-soft);width:24px;height:24px;border-radius:7px;display:grid;place-items:center;flex:none}
  .sec-h h3{font-size:.82rem;font-weight:800;letter-spacing:.1em;text-transform:uppercase;margin:0;color:var(--ink)}

  /* trigger / prereqs list */
  ul.ticks{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:9px}
  ul.ticks li{display:grid;grid-template-columns:20px minmax(0,1fr);gap:11px;font-size:.95rem;color:var(--ink)}
  ul.ticks li .tk{margin-top:3px;width:18px;height:18px;border-radius:5px;background:var(--accent-soft);
    color:var(--accent);display:grid;place-items:center;flex:none}
  ul.ticks li .tk svg{width:11px;height:11px}
  ul.ticks.dot li .tk{background:var(--surface-2);color:var(--muted)}

  /* plays — genuinely sequential steps */
  ol.plays{list-style:none;margin:0;padding:0;counter-reset:play;display:flex;flex-direction:column;gap:0}
  ol.plays li{position:relative;counter-increment:play;padding:0 0 20px 46px}
  ol.plays li:last-child{padding-bottom:0}
  ol.plays li::before{content:counter(play,decimal-leading-zero);position:absolute;left:0;top:-1px;
    font-family:var(--mono);font-size:.72rem;font-weight:700;color:var(--accent);
    width:30px;height:30px;border-radius:8px;background:var(--accent-soft);display:grid;place-items:center}
  ol.plays li::after{content:"";position:absolute;left:15px;top:32px;bottom:8px;width:2px;
    background:linear-gradient(var(--border-2),transparent)}
  ol.plays li:last-child::after{display:none}
  .play-t{font-size:.98rem;font-weight:700;margin:4px 0 4px;letter-spacing:-.01em}
  .play-d{font-size:.92rem;color:var(--muted);margin:0}
  .play-d code{font-family:var(--mono);font-size:.84em;background:var(--surface-2);padding:1px 5px;border-radius:5px;color:var(--ink)}

  /* templates */
  .tpl{border:1px solid var(--border);border-radius:12px;overflow:hidden;margin-bottom:12px;background:var(--surface)}
  .tpl:last-child{margin-bottom:0}
  .tpl-h{display:flex;align-items:center;gap:10px;padding:9px 12px;background:var(--surface-2);border-bottom:1px solid var(--border)}
  .tpl-h .lbl{font-family:var(--mono);font-size:.72rem;font-weight:700;letter-spacing:.02em;color:var(--ink);min-width:0;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .tpl-h .lbl span{color:var(--faint);font-weight:500}
  .tpl-h .cp{margin-left:auto;flex:none;font-family:var(--sans);font-size:.72rem;font-weight:700;
    border:1px solid var(--border-2);background:var(--surface);color:var(--muted);border-radius:8px;
    padding:5px 9px;cursor:pointer;transition:.14s;display:inline-flex;align-items:center;gap:5px}
  .tpl-h .cp:hover{border-color:var(--accent);color:var(--accent)}
  .tpl-h .cp.done{border-color:var(--starter);color:var(--starter)}
  .tpl-h .cp svg{width:12px;height:12px}
  .tpl pre{margin:0;padding:13px 14px;overflow-x:auto;font-family:var(--mono);font-size:.82rem;line-height:1.6;
    color:var(--ink);white-space:pre-wrap;word-break:break-word}
  .tpl pre::-webkit-scrollbar{height:8px}
  .tpl pre::-webkit-scrollbar-thumb{background:var(--border-2);border-radius:99px}

  /* metrics grid */
  .metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
  .metric{border:1px solid var(--border);border-radius:11px;padding:13px 14px;background:var(--surface-2)}
  .metric .mv{font-family:var(--mono);font-size:1.05rem;font-weight:700;color:var(--accent);letter-spacing:-.01em}
  .metric .ml{font-size:.82rem;color:var(--muted);margin-top:3px;line-height:1.4}

  /* pitfalls */
  ul.pit{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:9px}
  ul.pit li{display:grid;grid-template-columns:20px minmax(0,1fr);gap:11px;font-size:.93rem;color:var(--ink)}
  ul.pit li .x{margin-top:2px;width:18px;height:18px;border-radius:5px;background:var(--advanced-soft);
    color:var(--advanced);display:grid;place-items:center;flex:none;font-weight:800;font-size:.7rem}

  .foot-note{padding:16px 30px 24px;border-top:1px solid var(--border);color:var(--faint);font-size:.78rem;line-height:1.5}
  @media (max-width:560px){ .foot-note{padding:16px 18px 22px} }
  .foot-note b{color:var(--muted);font-weight:700}

  .toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);
    background:var(--ink);color:var(--ground);font-size:.86rem;font-weight:650;padding:11px 18px;border-radius:11px;
    box-shadow:var(--shadow-lg);opacity:0;pointer-events:none;transition:.25s;z-index:80;display:flex;align-items:center;gap:8px}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  .toast svg{width:15px;height:15px;color:var(--starter)}

  @media print{
    header.top,.rail,.toast{display:none!important}
    main{display:block;padding:0}
    .panel{box-shadow:none;border:none}
    body{background:#fff}
  }
  @media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>

<header class="top">
  <div class="wrap top-in">
    <div class="brand">
      <div class="mark" aria-hidden="true"></div>
      <div style="min-width:0">
        <h1>GTM Playbook Library</h1>
        <div class="sub">plansom · start-from plays</div>
      </div>
    </div>
    <div class="top-spacer"></div>
    <div class="top-stat" id="topStat"></div>
    <button class="icon-btn" id="printBtn" title="Print or save the open playbook as PDF">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9V2h12v7"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></svg>
      Export
    </button>
    <button class="icon-btn" id="themeBtn" title="Toggle light / dark" aria-label="Toggle theme">
      <svg id="themeIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    </button>
  </div>
</header>

<div class="wrap">
  <main>
    <aside class="rail">
      <div class="search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
        <input id="q" type="search" placeholder="Search plays, e.g. onboarding, SPIN, SEO…" autocomplete="off" aria-label="Search playbooks">
      </div>
      <div class="filters" id="filters"></div>
      <div class="list" id="list" role="listbox" aria-label="Playbooks"></div>
    </aside>
    <div class="panel" id="panel"></div>
  </main>
</div>

<div class="toast" id="toast"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg><span id="toastMsg">Copied</span></div>

<script>
/* ---------------- icon set (category glyphs) ---------------- */
const I = {
  msg:'<path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>',
  cnt:'<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/><path d="M8 13h8M8 17h5"/>',
  out:'<path d="m22 2-7 20-4-9-9-4z"/><path d="M22 2 11 13"/>',
  spn:'<path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/>',
  jny:'<circle cx="12" cy="12" r="9"/><path d="m8 12 3 3 5-6"/>',
  cab:'<path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/>',
  evt:'<rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/>',
  par:'<path d="M20.9 12.5a5 5 0 0 0-7-7l-1 1-1-1a5 5 0 0 0-7 7l8 8z"/>',
  trf:'<path d="M3 3v18h18"/><path d="m7 15 4-4 3 3 5-6"/>',
  soc:'<circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="m8.6 13.5 6.8 4M15.4 6.5 8.6 10.5"/>'
};

/* ---------------- playbook data ---------------- */
const PB = [
 {
  code:"MSG-01", cat:"Messaging", icon:"msg", diff:"starter", ttv:"Half a day",
  title:"Nail the one-line positioning everyone repeats",
  objective:"Land a single sentence that says what Plansom is, who it's for, and why it's different — so every page, pitch, and rep says the same thing.",
  meta:{Owner:"Founder / Head of Marketing", Effort:"~4 hours", Cadence:"Once, then revisit quarterly", Pillar:"01 · Messaging & Brand"},

  ],

/* ---------------- render ---------------- */
const CATS = [...new Set(PB.map(p=>p.cat))];
const DIFF_ORDER = {starter:0,core:1,advanced:2};
const state = {q:"", cat:"All", sel:PB[0].code};

const listEl = document.getElementById('list');
const panelEl = document.getElementById('panel');
const filtersEl = document.getElementById('filters');
const topStat = document.getElementById('topStat');
const qEl = document.getElementById('q');

function esc(s){return String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));}

/* filters */
function renderFilters(){
  const chips = ["All",...CATS];
  filtersEl.innerHTML = chips.map(c=>
    `<button class="fchip" data-cat="${esc(c)}" aria-pressed="${state.cat===c}">${esc(c)}</button>`
  ).join('');
  filtersEl.querySelectorAll('.fchip').forEach(b=>b.onclick=()=>{state.cat=b.dataset.cat;renderList();});
}

function matches(p){
  if(state.cat!=="All" && p.cat!==state.cat) return false;
  if(!state.q) return true;
  const hay=(p.title+" "+p.cat+" "+p.code+" "+p.objective+" "+p.plays.map(x=>x.t).join(" ")).toLowerCase();
  return hay.includes(state.q.toLowerCase());
}

function renderList(){
  renderFilters();
  const items = PB.filter(matches).sort((a,b)=>DIFF_ORDER[a.diff]-DIFF_ORDER[b.diff]);
  topStat.innerHTML = `<b>${PB.length}</b> plays · <b>${CATS.length}</b> pillars`;
  if(!items.length){ listEl.innerHTML = `<div class="empty">No plays match “${esc(state.q)}”.<br>Try a pillar or a keyword like <b>onboarding</b>.</div>`; return; }
  listEl.innerHTML = items.map(p=>`
    <button class="pb" role="option" data-code="${p.code}" aria-selected="${state.sel===p.code}">
      <span class="pb-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${I[p.icon]}</svg></span>
      <span style="min-width:0">
        <span class="pb-code mono">${p.code}</span>
        <span class="pb-title">${esc(p.title)}</span>
        <span class="pb-meta">
          <span class="diff ${p.diff}">${p.diff}</span>
          <span class="ttv mono"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>${esc(p.ttv)}</span>
        </span>
      </span>
    </button>`).join('');
  listEl.querySelectorAll('.pb').forEach(b=>b.onclick=()=>{state.sel=b.dataset.code;renderList();renderPanel();
    if(window.innerWidth<=940) panelEl.scrollIntoView({behavior:'smooth',block:'start'});});
}

function renderPanel(){
  const p = PB.find(x=>x.code===state.sel) || PB[0];
  const metaOrder = Object.entries(p.meta);
  panelEl.innerHTML = `
    <div class="ph">
      <div class="ph-tab mono">
        <span class="pb-ico" style="width:22px;height:22px;border-radius:6px;background:var(--accent-soft)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="width:13px;height:13px">${I[p.icon]}</svg></span>
        <span class="code">${p.code}</span><span class="sep"></span>${esc(p.cat)}<span class="sep"></span><span class="diff ${p.diff}">${p.diff}</span>
      </div>
      <h2>${esc(p.title)}</h2>
      <p class="objective"><b>The goal.</b> ${esc(p.objective)}</p>
      <div class="metabar">
        ${metaOrder.map(([k,v])=>`<div class="m"><div class="k">${esc(k)}</div><div class="v">${esc(v)}</div></div>`).join('')}
      </div>
    </div>
    <div class="pbody">
      <section class="sec">
        <div class="sec-h"><span class="n mono">A</span><h3>When to run this</h3></div>
        <ul class="ticks">${p.when.map(w=>`<li><span class="tk"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg></span><span>${esc(w)}</span></li>`).join('')}</ul>
      </section>
      <section class="sec">
        <div class="sec-h"><span class="n mono">B</span><h3>What you'll need</h3></div>
        <ul class="ticks dot">${p.need.map(w=>`<li><span class="tk"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M5 12h14"/></svg></span><span>${esc(w)}</span></li>`).join('')}</ul>
      </section>
      <section class="sec">
        <div class="sec-h"><span class="n mono">C</span><h3>The plays</h3></div>
        <ol class="plays">${p.plays.map(s=>`<li><div class="play-t">${esc(s.t)}</div><p class="play-d">${s.d}</p></li>`).join('')}</ol>
      </section>
      <section class="sec">
        <div class="sec-h"><span class="n mono">D</span><h3>Copy-paste templates</h3></div>
        ${p.tpl.map((t,i)=>`
          <div class="tpl">
            <div class="tpl-h">
              <span class="lbl mono">${esc(t.lbl)}${t.sub?` <span>· ${esc(t.sub)}</span>`:''}</span>
              <button class="cp" data-code="${p.code}" data-i="${i}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>Copy</button>
            </div>
            <pre>${esc(t.body)}</pre>
          </div>`).join('')}
      </section>
      <section class="sec">
        <div class="sec-h"><span class="n mono">E</span><h3>How you'll know it worked</h3></div>
        <div class="metrics">${p.metrics.map(m=>`<div class="metric"><div class="mv mono">${esc(m.v)}</div><div class="ml">${esc(m.l)}</div></div>`).join('')}</div>
      </section>
      <section class="sec">
        <div class="sec-h"><span class="n mono">F</span><h3>Watch out for</h3></div>
        <ul class="pit">${p.pit.map(w=>`<li><span class="x">!</span><span>${esc(w)}</span></li>`).join('')}</ul>
      </section>
    </div>
    <div class="foot-note">
      <b>How to use this.</b> Every play is a starting point, not a rule — clone it, cut what doesn't fit your stage, and make it yours. Bracketed <span class="mono">{{fields}}</span> and blanks are meant to be filled. Metrics shown are targets to aim at, not promises. Positioning line throughout: <i>Plansom is an AI-powered planning platform that transforms ideas, tasks, and goals into clear, actionable plans.</i>
    </div>`;
  panelEl.querySelectorAll('.cp').forEach(btn=>btn.onclick=()=>{
    const pb=PB.find(x=>x.code===btn.dataset.code); const t=pb.tpl[+btn.dataset.i];
    copy(t.body, btn);
  });
}

/* clipboard */
function copy(text, btn){
  const done=()=>{ if(btn){btn.classList.add('done');btn.innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>Copied';
    setTimeout(()=>{btn.classList.remove('done');btn.innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>Copy';},1600);} toast('Template copied to clipboard'); };
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(text).then(done).catch(()=>fallback(text,done));}
  else fallback(text,done);
}
function fallback(text,cb){const ta=document.createElement('textarea');ta.value=text;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();try{document.execCommand('copy');cb();}catch(e){}document.body.removeChild(ta);}
let toastT;
function toast(msg){const t=document.getElementById('toast');document.getElementById('toastMsg').textContent=msg;t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),1800);}

/* search + keyboard */
qEl.addEventListener('input',e=>{state.q=e.target.value;renderList();});
document.addEventListener('keydown',e=>{
  if(e.key==='/'&&document.activeElement!==qEl){e.preventDefault();qEl.focus();return;}
  if(document.activeElement===qEl) return;
  if(e.key==='ArrowDown'||e.key==='ArrowUp'||e.key==='j'||e.key==='k'){
    const items=PB.filter(matches).sort((a,b)=>DIFF_ORDER[a.diff]-DIFF_ORDER[b.diff]);
    const i=items.findIndex(x=>x.code===state.sel);
    const dir=(e.key==='ArrowDown'||e.key==='j')?1:-1;
    const next=items[(i+dir+items.length)%items.length];
    if(next){state.sel=next.code;renderList();renderPanel();e.preventDefault();}
  }
});

/* theme */
const root=document.documentElement;
function isDark(){const t=root.getAttribute('data-theme');return t?t==='dark':matchMedia('(prefers-color-scheme:dark)').matches;}
function paintThemeIcon(){document.getElementById('themeIcon').innerHTML = isDark()
  ? '<path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>'
  : '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>';}
document.getElementById('themeBtn').onclick=()=>{root.setAttribute('data-theme',isDark()?'light':'dark');paintThemeIcon();};
document.getElementById('printBtn').onclick=()=>window.print();
matchMedia('(prefers-color-scheme:dark)').addEventListener?.('change',paintThemeIcon);

/* boot */
renderList();renderPanel();paintThemeIcon();
</script>
