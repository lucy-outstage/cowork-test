<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Tiny Mario</title>
<style>
  body { margin: 0; background: #5c94fc; font-family: monospace; color: #fff; }
  #wrap { display: flex; flex-direction: column; align-items: center; padding: 16px; }
  canvas { background: #5c94fc; image-rendering: pixelated; border: 2px solid #222; }
  #hud { margin-top: 8px; }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game" width="640" height="360"></canvas>
  <div id="hud">Arrow keys / A,D to move &nbsp; Space / W / Up to jump &nbsp; R to restart</div>
</div>
<script>
const c = document.getElementById('game');
const ctx = c.getContext('2d');
const W = c.width, H = c.height;

const GRAVITY = 0.6;
const MOVE = 0.5;
const FRICTION = 0.82;
const MAX_VX = 4;
const JUMP = 11;

const keys = {};
addEventListener('keydown', e => { keys[e.key.toLowerCase()] = true; if ([' ','arrowup','arrowdown','arrowleft','arrowright'].includes(e.key.toLowerCase())) e.preventDefault(); });
addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });

const GROUND_Y = H - 40;

const platforms = [
  { x: 0,   y: GROUND_Y, w: 1600, h: 40 },
  { x: 180, y: 270, w: 80,  h: 16 },
  { x: 320, y: 220, w: 80,  h: 16 },
  { x: 460, y: 180, w: 80,  h: 16 },
  { x: 620, y: 240, w: 120, h: 16 },
  { x: 820, y: 200, w: 80,  h: 16 },
  { x: 980, y: 260, w: 100, h: 16 },
  { x: 1160,y: 220, w: 80,  h: 16 },
  { x: 1300,y: 180, w: 80,  h: 16 },
];

const coins = [
  {x:200,y:240},{x:340,y:190},{x:480,y:150},{x:660,y:210},
  {x:840,y:170},{x:1000,y:230},{x:1180,y:190},{x:1320,y:150},
];

const enemies = [
  { x: 400, y: GROUND_Y-20, w:20, h:20, vx:-1, alive:true, min:340, max:560 },
  { x: 800, y: GROUND_Y-20, w:20, h:20, vx:-1, alive:true, min:760, max:920 },
  { x: 1200,y: GROUND_Y-20, w:20, h:20, vx:-1, alive:true, min:1120,max:1340 },
];

const goal = { x: 1500, y: GROUND_Y-60, w: 20, h: 60 };

let player, score, won, dead, cam;

function reset() {
  player = { x: 30, y: GROUND_Y - 28, w: 20, h: 28, vx: 0, vy: 0, onGround: false, face: 1 };
  score = 0; won = false; dead = false; cam = 0;
  for (const co of coins) co.taken = false;
  for (const e of enemies) { e.alive = true; e.x = (e.min + e.max)/2; e.vx = -1; }
}
reset();

function rectsHit(a, b) {
  return a.x < b.x+b.w && a.x+a.w > b.x && a.y < b.y+b.h && a.y+a.h > b.y;
}

function update() {
  if (keys['r']) reset();
  if (won || dead) return;

  if (keys['arrowleft'] || keys['a']) { player.vx -= MOVE; player.face = -1; }
  if (keys['arrowright'] || keys['d']) { player.vx += MOVE; player.face = 1; }
  if ((keys[' '] || keys['arrowup'] || keys['w']) && player.onGround) {
    player.vy = -JUMP; player.onGround = false;
  }
  player.vx = Math.max(-MAX_VX, Math.min(MAX_VX, player.vx * FRICTION + (
    (keys['arrowleft']||keys['a'] ? -MOVE : 0) + (keys['arrowright']||keys['d'] ? MOVE : 0)
  )));
  player.vy += GRAVITY;

  player.x += player.vx;
  for (const p of platforms) {
    if (rectsHit(player, p)) {
      if (player.vx > 0) player.x = p.x - player.w;
      else if (player.vx < 0) player.x = p.x + p.w;
      player.vx = 0;
    }
  }

  player.y += player.vy;
  player.onGround = false;
  for (const p of platforms) {
    if (rectsHit(player, p)) {
      if (player.vy > 0) { player.y = p.y - player.h; player.vy = 0; player.onGround = true; }
      else if (player.vy < 0) { player.y = p.y + p.h; player.vy = 0; }
    }
  }

  if (player.x < 0) player.x = 0;

  for (const co of coins) {
    if (!co.taken && rectsHit(player, {x:co.x-6, y:co.y-6, w:12, h:12})) {
      co.taken = true; score += 10;
    }
  }

  for (const e of enemies) {
    if (!e.alive) continue;
    e.x += e.vx;
    if (e.x < e.min) { e.x = e.min; e.vx *= -1; }
    if (e.x > e.max) { e.x = e.max; e.vx *= -1; }
    if (rectsHit(player, e)) {
      if (player.vy > 0 && player.y + player.h - e.y < 14) {
        e.alive = false; player.vy = -7; score += 50;
      } else {
        dead = true;
      }
    }
  }

  if (player.y > H + 200) dead = true;

  if (rectsHit(player, goal)) won = true;

  cam = Math.max(0, Math.min(player.x - W/2 + player.w/2, 1600 - W));
}

function draw() {
  ctx.fillStyle = '#5c94fc';
  ctx.fillRect(0, 0, W, H);

  ctx.fillStyle = '#ffffff';
  for (let i = 0; i < 5; i++) {
    const cx = ((i*220 - cam*0.3) % 1600 + 1600) % 1600;
    ctx.beginPath();
    ctx.arc(cx, 60+i*10, 16, 0, Math.PI*2);
    ctx.arc(cx+18, 55+i*10, 20, 0, Math.PI*2);
    ctx.arc(cx+38, 60+i*10, 16, 0, Math.PI*2);
    ctx.fill();
  }

  ctx.save();
  ctx.translate(-cam, 0);

  ctx.fillStyle = '#c84c0c';
  ctx.fillRect(0, GROUND_Y, 1600, 40);
  ctx.fillStyle = '#7a3a18';
  for (let x = 0; x < 1600; x += 16) ctx.fillRect(x, GROUND_Y, 1, 40);

  ctx.fillStyle = '#fc9838';
  for (const p of platforms.slice(1)) {
    ctx.fillRect(p.x, p.y, p.w, p.h);
    ctx.fillStyle = '#a04818';
    ctx.fillRect(p.x, p.y, p.w, 2);
    ctx.fillStyle = '#fc9838';
  }

  for (const co of coins) {
    if (co.taken) continue;
    ctx.fillStyle = '#ffd400';
    ctx.beginPath(); ctx.arc(co.x, co.y, 6, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#a06800';
    ctx.fillRect(co.x-1, co.y-3, 2, 6);
  }

  for (const e of enemies) {
    if (!e.alive) continue;
    ctx.fillStyle = '#8b4513';
    ctx.fillRect(e.x, e.y, e.w, e.h);
    ctx.fillStyle = '#fff';
    ctx.fillRect(e.x+4, e.y+6, 4, 4);
    ctx.fillRect(e.x+12, e.y+6, 4, 4);
    ctx.fillStyle = '#000';
    ctx.fillRect(e.x+5, e.y+7, 2, 2);
    ctx.fillRect(e.x+13, e.y+7, 2, 2);
  }

  ctx.fillStyle = '#000';
  ctx.fillRect(goal.x+9, goal.y, 2, goal.h);
  ctx.fillStyle = '#00c000';
  ctx.beginPath();
  ctx.moveTo(goal.x+11, goal.y);
  ctx.lineTo(goal.x+30, goal.y+8);
  ctx.lineTo(goal.x+11, goal.y+16);
  ctx.fill();

  const px = player.x, py = player.y;
  ctx.fillStyle = '#e52521';
  ctx.fillRect(px+2, py, 16, 8);
  ctx.fillStyle = '#fcb088';
  ctx.fillRect(px+4, py+8, 12, 8);
  ctx.fillStyle = '#000';
  ctx.fillRect(px + (player.face>0?12:6), py+10, 2, 2);
  ctx.fillStyle = '#0050fc';
  ctx.fillRect(px+2, py+16, 16, 10);
  ctx.fillStyle = '#7a3a18';
  ctx.fillRect(px+2, py+26, 7, 2);
  ctx.fillRect(px+11, py+26, 7, 2);

  ctx.restore();

  ctx.fillStyle = '#fff';
  ctx.font = '18px monospace';
  ctx.fillText('SCORE ' + score, 12, 22);

  if (won) {
    ctx.fillStyle = 'rgba(0,0,0,0.5)';
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = '#fff';
    ctx.font = '32px monospace';
    ctx.fillText('YOU WIN!  Press R', W/2 - 150, H/2);
  } else if (dead) {
    ctx.fillStyle = 'rgba(0,0,0,0.5)';
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = '#fff';
    ctx.font = '32px monospace';
    ctx.fillText('GAME OVER  Press R', W/2 - 170, H/2);
  }
}

function loop() { update(); draw(); requestAnimationFrame(loop); }
loop();
</script>
</body>
</html>
